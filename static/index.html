<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Document Assistant</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: linear-gradient(90deg, #3b82f6, #2563eb);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    #upload-container {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    input[type=file] {
      color: white;
    }

    #upload-btn {
      background: #10b981;
      color: white;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    #upload-btn:hover {
      background: #059669;
    }

    #chat-container {
      flex: 1;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 70%;
      padding: 0.9rem 1.2rem;
      border-radius: 15px;
      word-wrap: break-word;
      white-space: pre-wrap;
      line-height: 1.4;
      animation: fadeIn 0.3s ease;
    }

    .user {
      background: #3b82f6;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .system {
      background: #fef08a;
      color: #854d0e;
      align-self: center;
      font-size: 0.9rem;
      text-align: center;
      border-radius: 8px;
      padding: 0.5rem;
      max-width: 100%;
      border: 1px solid #fde047;
    }

    .typing {
      font-style: italic;
      color: #555;
    }

    #input-container {
      display: flex;
      padding: 0.6rem 1rem;
      gap: 0.6rem;
      background: #e5e7eb;
      position: sticky;
      bottom: 0;
      box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.05);
    }

    #input {
      flex: 1;
      padding: 0.85rem 1rem;
      border-radius: 25px;
      border: 1px solid #ccc;
      font-size: 1rem;
      outline: none;
    }

    #input:focus {
      border-color: #3b82f6;
    }

    #send-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 0.8rem 1.4rem;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 500;
    }

    #send-btn:hover {
      background: #2563eb;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>AI Document Assistant</h1>
    <div id="upload-container">
      <input type="file" id="pdf-upload" accept=".pdf">
      <button id="upload-btn">Upload PDF</button>
    </div>
  </header>
  <div id="chat-container"></div>
  <div id="input-container">
    <input type="text" id="input" placeholder="Ask a question about the PDF...">
    <button id="send-btn">Send</button>
  </div>
  <script>
    const chatContainer = document.getElementById('chat-container');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const pdfUpload = document.getElementById('pdf-upload');
    const messages = [];

    function addMessage(role, content) {
      if (role !== 'system') messages.push({ role, content });
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = content;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    addMessage('ai', "Welcome! Please upload a PDF, then ask me anything about it.");

    uploadBtn.addEventListener('click', async () => {
      const file = pdfUpload.files[0];
      if (!file) return alert("Please select a PDF file first.");

      const formData = new FormData();
      formData.append("file", file);

      addMessage('system', 'Uploading and processing PDF... This may take a moment.');
      uploadBtn.disabled = true;

      try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();
        if (res.ok) addMessage('system', ' ' + data.message);
        else addMessage('system', ' Error: ' + data.detail);
      } catch (e) {
        addMessage('system', ' Network Error uploading PDF.');
      }
      uploadBtn.disabled = false;
    });

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMessage('user', text);
      const typingIndicator = addMessage('system', '<span class="typing">AI is checking the document...</span>');

      try {
        const payload = {
          session_id: "default_session",
          question: text,
          chat_history: messages.filter(m => m.role === "user" || m.role === "ai").map(m => [m.role, m.content])
        };
        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        chatContainer.removeChild(typingIndicator);
        if (res.ok) addMessage('ai', data.answer);
        else addMessage('system', ' Error: ' + data.detail);
      } catch (err) {
        chatContainer.removeChild(typingIndicator);
        addMessage('system', "Error connecting to server.");
      }
    }
    sendBtn.addEventListener('click', sendMessage);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
  </script>
</body>

</html>
